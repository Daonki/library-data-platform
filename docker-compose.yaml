# 공공도서관 열람실 데이터 플랫폼 (Airflow + PostgreSQL)
# 실행: docker compose up airflow-init  →  docker compose up -d
x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.12
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Seoul
    # 적재 대상 DB (DAG에서 PostgresHook("dw")로 사용)
    AIRFLOW_CONN_DW: postgresql://dw:dw@postgres:5432/dw
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # dw DB·계정 생성
    ports:
      - "5433:5432"                         # 로컬에서 SQL 조회용
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped                 # Docker가 켜지면 DB도 자동으로 올라오게

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate && (airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true)"]

  airflow-webserver:
    <<: *airflow-common
    # 비정상 종료 뒤 남은 PID 파일 때문에 "Already running"으로 안 뜨는 문제 방지
    command: ["bash", "-c", "rm -f /opt/airflow/airflow-webserver.pid && exec airflow webserver"]
    ports:
      - "8080:8080"
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

volumes:
  pgdata:
